name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # لمنع التعليق لساعات

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm' # تفعيل كاش المكتبات

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle' # تفعيل كاش الجرادل (يوفر وقت ضخم)

      - name: Install dependencies
        run: npm ci # أسرع وأكثر أماناً من install في الـ CI

      - name: Generate native android
        # إضافة --no-interactive لمنع التوقف بانتظار إدخال مستخدم
        run: npx expo prebuild --platform android --clean --no-interactive

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew  # إعطاء صلاحية التنفيذ للجرادل
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk # تحسين المسار لجلب أي APK ينتج
